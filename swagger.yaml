openapi: 3.0.0
info:
  title: E-Commerce API
  description: API documentation for the e-commerce platform
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Accounts
    description: Account management endpoints
  - name: Products
    description: Product management endpoints
  - name: Cart
    description: Shopping cart endpoints
  - name: Orders
    description: Order management endpoints

paths:
  /accounts/create:
    post:
      tags:
        - Accounts
      summary: Create a new account
      description: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123
                name:
                  type: string
                  example: John Doe
                phone:
                  type: string
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  phone:
                    type: string
                  is_active:
                    type: boolean
                  is_admin:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid input
        '409':
          description: Account already exists

  /accounts/login:
    post:
      tags:
        - Accounts
      summary: Login to account
      description: Authenticate user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  is_admin:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
        '401':
          description: Invalid credentials

  /accounts/logout:
    post:
      tags:
        - Accounts
      summary: Logout from account
      description: End the user session
      responses:
        '200':
          description: Logout successful

  /accounts/profile:
    get:
      tags:
        - Accounts
      summary: Get user profile
      description: Retrieve authenticated user's profile information
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  phone:
                    type: string
                  is_admin:
                    type: boolean
                  is_active:
                    type: boolean
                  address_id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized

  /accounts/addresses:
    get:
      tags:
        - Accounts
      summary: Get user addresses
      description: Retrieve all addresses for authenticated user
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Addresses retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    full_name:
                      type: string
                    street1:
                      type: string
                    street2:
                      type: string
                    city:
                      type: string
                    zip:
                      type: string
                    country:
                      type: string
                    phone:
                      type: string
                    account_id:
                      type: string
                    created_at:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized

    post:
      tags:
        - Accounts
      summary: Create new address
      description: Add a new address to authenticated user's profile
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                street1:
                  type: string
                street2:
                  type: string
                city:
                  type: string
                zip:
                  type: string
                country:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Address created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  full_name:
                    type: string
                  street1:
                    type: string
                  street2:
                    type: string
                  city:
                    type: string
                  zip:
                    type: string
                  country:
                    type: string
                  phone:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

  /accounts/addresses/{id}:
    put:
      tags:
        - Accounts
      summary: Update address
      description: Update an existing address for authenticated user
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                street1:
                  type: string
                street2:
                  type: string
                city:
                  type: string
                zip:
                  type: string
                country:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Address updated successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Address not found
        '500':
          description: Server error

    delete:
      tags:
        - Accounts
      summary: Delete address
      description: Remove an address from authenticated user's profile
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Address deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Address not found

  /products:
    post:
      tags:
        - Products
      summary: Create product
      description: Create a new product (Admin only)
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: Unique product code
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: double
                quantity:
                  type: integer
                discount:
                  type: number
                  format: double
                category:
                  type: string
                variant_code:
                  type: string
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

  /products/list:
    get:
      tags:
        - Products
      summary: List all products
      description: Retrieve all available products
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: search
          in: query
          description: Search term matched against name, code, or description
          schema:
            type: string
        - name: categorie
          in: query
          description: Filter by category (controller uses query param named 'categorie')
          schema:
            type: string
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        code:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        price:
                          type: number
                        quantity:
                          type: integer
                        discount:
                          type: number
                        category:
                          type: string
                        variant_code:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        image_url:
                          type: array
                          items:
                            type: string
                  limit:
                    type: number
                  page:
                    type: number
                  hasNext:
                    type: boolean

  /products/categories:
    get:
      tags:
        - Products
      summary: List product categories
      description: Retrieve distinct product categories
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    count:
                      type: integer
        '500':
          description: Server error

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product details
      description: Retrieve detailed information about a specific product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  code:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  price:
                    type: number
                  quantity:
                    type: integer
                  discount:
                    type: number
                  category:
                    type: string
                  variant_code:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  image_url:
                    type: array
                    items:
                      type: string
        '404':
          description: Product not found

    put:
      tags:
        - Products
      summary: Update product
      description: Update product details (Admin only)
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                quantity:
                  type: integer
                discount:
                  type: number
                category:
                  type: string
                variant_code:
                  type: string
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Product not found

    delete:
      tags:
        - Products
      summary: Delete product
      description: Remove a product from catalog (Admin only)
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Product not found

  /products/{id}/images:
    get:
      tags:
        - Products
      summary: Get product images
      description: Retrieve all image URLs for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image URLs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          description: Unauthorized

    post:
      tags:
        - Products
      summary: Add product image
      description: Add an image URL for the given product
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '201':
          description: Image added successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

    delete:
      tags:
        - Products
      summary: Delete product image
      description: Delete a specific image URL for the given product
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: url
          in: query
          required: true
          description: Image URL to delete
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Image deleted successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Image not found

  /cart:
    get:
      tags:
        - Cart
      summary: Get shopping cart
      description: Retrieve the authenticated user's shopping cart
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    cart_item_id:
                      type: string
                    code:
                      type: string
                    discount:
                      type: string
                    name:
                      type: string
                    price:
                      type: string
                    product_id:
                      type: string
                    product_image:
                      type: string
                    quantity:
                      type: integer
                    stock:
                      type: integer
                    variant_code:
                      type: string
        '401':
          description: Unauthorized

    post:
      tags:
        - Cart
      summary: Add or update cart item
      description: Add a product to cart or update its quantity
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - quantity
              properties:
                product_id:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Cart item added/updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  product_id:
                    type: string
                  quantity:
                    type: integer
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Product not found

    delete:
      tags:
        - Cart
      summary: Clear shopping cart
      description: Remove all items from the authenticated user's cart
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Cart cleared successfully
        '401':
          description: Unauthorized

  /orders:
    get:
      tags:
        - Orders
      summary: Get user orders
      description: Retrieve all orders for the authenticated user
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    account_id:
                      type: string
                    status_id:
                      type: integer
                    address:
                      type: object
                      nullable: true
                      properties:
                        id:
                          type: string
                        street1:
                          type: string
                        street2:
                          type: string
                          nullable: true
                        city:
                          type: string
                        zip:
                          type: string
                        country:
                          type: string
                    created_at:
                      type: string
                      format: date-time
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          quantity:
                            type: integer
                          item_id:
                            type: integer
                          product:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              code:
                                type: string
                              price:
                                type: number
                              description:
                                type: string
                              image:
                                type: string
                                format: uri
                                nullable: true
              example:
                - id: "14"
                  created_at: "2023-10-13T16:00:00.000Z"
                  account_id: "413"
                  status_id: 1
                  address:
                    id: "5"
