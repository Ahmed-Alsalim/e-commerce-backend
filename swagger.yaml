                  account_id: "413"
                  status_id: 3
                  address:
                    id: "3"
                    street1: "789 Oak Ave"
                    street2: null
                    city: "Smallville"
                    zip: "24680"
                    country: "USA"
                  items:
                    - item_id: 2
                      quantity: 1
                      product:
                        id: 3
                        name: "USB-C Hub"
                        code: "PROD-003"
