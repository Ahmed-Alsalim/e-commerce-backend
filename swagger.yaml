openapi: 3.0.0
info:
  title: E-Commerce API
  description: API documentation for the e-commerce platform
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Accounts
    description: Account management endpoints
  - name: Products
    description: Product management endpoints
  - name: Cart
    description: Shopping cart endpoints
  - name: Orders
    description: Order management endpoints

paths:
  /accounts/create:
    post:
      tags:
        - Accounts
      summary: Create a new account
      description: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  firstName:
                    type: string
                  lastName:
                    type: string
        '400':
          description: Invalid input
        '409':
          description: Account already exists

  /accounts/login:
    post:
      tags:
        - Accounts
      summary: Login to account
      description: Authenticate user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  firstName:
                    type: string
        '401':
          description: Invalid credentials

  /accounts/logout:
    post:
      tags:
        - Accounts
      summary: Logout from account
      description: End the user session
      responses:
        '200':
          description: Logout successful

  /accounts/profile:
    get:
      tags:
        - Accounts
      summary: Get user profile
      description: Retrieve authenticated user's profile information
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  firstName:
                    type: string
                  lastName:
                    type: string
        '401':
          description: Unauthorized

  /accounts/addresses:
    get:
      tags:
        - Accounts
      summary: Get user addresses
      description: Retrieve all addresses for authenticated user
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Addresses retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    zipCode:
                      type: string
                    country:
                      type: string
        '401':
          description: Unauthorized

    post:
      tags:
        - Accounts
      summary: Create new address
      description: Add a new address to authenticated user's profile
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - street
                - city
                - state
                - zipCode
                - country
              properties:
                street:
                  type: string
                city:
                  type: string
                state:
                  type: string
                zipCode:
                  type: string
                country:
                  type: string
      responses:
        '201':
          description: Address created successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

  /accounts/addresses/{id}:
    delete:
      tags:
        - Accounts
      summary: Delete address
      description: Remove an address from authenticated user's profile
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Address deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Address not found

  /products:
    post:
      tags:
        - Products
      summary: Create product
      description: Create a new product (Admin only)
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - price
                - stock
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: double
                stock:
                  type: integer
                category:
                  type: string
      responses:
        '201':
          description: Product created successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

  /products/list:
    get:
      tags:
        - Products
      summary: List all products
      description: Retrieve all available products
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                    price:
                      type: number
                    stock:
                      type: integer
                    category:
                      type: string

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product details
      description: Retrieve detailed information about a specific product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  price:
                    type: number
                  stock:
                    type: integer
                  category:
                    type: string
        '404':
          description: Product not found

    put:
      tags:
        - Products
      summary: Update product
      description: Update product details (Admin only)
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                category:
                  type: string
      responses:
        '200':
          description: Product updated successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Product not found

    delete:
      tags:
        - Products
      summary: Delete product
      description: Remove a product from catalog (Admin only)
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Product not found

  /cart:
    get:
      tags:
        - Cart
      summary: Get shopping cart
      description: Retrieve the authenticated user's shopping cart
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: string
                        quantity:
                          type: integer
                        price:
                          type: number
                  total:
                    type: number
        '401':
          description: Unauthorized

    post:
      tags:
        - Cart
      summary: Add or update cart item
      description: Add a product to cart or update its quantity
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Cart item added/updated successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Product not found

    delete:
      tags:
        - Cart
      summary: Clear shopping cart
      description: Remove all items from the authenticated user's cart
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Cart cleared successfully
        '401':
          description: Unauthorized

  /orders:
    get:
      tags:
        - Orders
      summary: Get user orders
      description: Retrieve all orders for the authenticated user
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          product_id:
                            type: string
                          quantity:
                            type: number
                          price:
                            type: number
                    total:
                      type: number
                    status:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized

    post:
      tags:
        - Orders
      summary: Create order
      description: Create a new order from the shopping cart
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addressId
              properties:
                addressId:
                  type: string
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: string
                        quantity:
                          type: number
                        price:
                          type: number
                  total:
                    type: number
                  status:
                    type: string
        '400':
          description: Invalid input or empty cart
        '401':
          description: Unauthorized
        '404':
          description: Address not found

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie authentication via Passport
