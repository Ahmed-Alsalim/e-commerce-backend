                        description: "7-in-1 multi-port adapter"
                        image: "https://picsum.photos/seed/product_3/500/500"
                    - item_id: 39
                      quantity: 1
                      product:
                        id: 38
                        name: "Stapler"
                        code: "PROD-038"
