    post:
      tags:
        - Orders
      summary: Create order
      description: Create a new order from the shopping cart
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addressId
                - items
              properties:
                addressId:
                  type: string
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                      - price
                    properties:
                      productId:
                        type: integer
                      quantity:
                        type: integer
                        minimum: 1
                      price:
                        type: number
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '400':
          description: Invalid input or empty cart
        '401':
          description: Unauthorized
        '404':
          description: Address not found

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie authentication via Passport
